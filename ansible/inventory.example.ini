# Exemple d'inventaire. Copier en inventory.ini et adapter.
#
# Essai à blanc  : ansible-playbook -i inventory.ini site.yml --check
# Poste pilote   : ansible-playbook -i inventory.ini site.yml --limit poste-pilote
# Parc entier    : ansible-playbook -i inventory.ini site.yml

[salles_informatiques]
poste-pilote   ansible_host=192.0.2.10
; salle-b-01   ansible_host=192.0.2.11
; salle-b-02   ansible_host=192.0.2.12

[salles_informatiques:vars]
ansible_connection=winrm
ansible_winrm_transport=kerberos
ansible_port=5986
ansible_user=administrateur@COLLEGE.LOCAL
